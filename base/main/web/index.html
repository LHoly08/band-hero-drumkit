<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kit configuration · Band Hero</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="bar">
      <strong>Band Hero</strong>
      <span id="device-status">Connecting to drum base…</span>
    </div>
  </header>

  <main>
    <div class="heading">
      <h1>Kit configuration</h1>
      <button class="primary" id="save-kit" type="button" disabled>Save kit</button>
    </div>
    <p class="muted status" id="kit-status" role="status"></p>

    <div class="workspace">
      <section class="card" aria-labelledby="assignments-heading">
        <header class="panel">
          <h2 id="assignments-heading">Pads <small id="pad-count"></small></h2>
          <button id="add-pad" type="button" disabled>Add pad</button>
        </header>
        <div class="empty" id="list-empty">
          <p id="list-message">Loading kit…</p>
          <button id="retry-load" type="button" hidden>Retry</button>
        </div>
        <ol id="pad-list" aria-label="Pads in matching order" hidden></ol>
        <p class="muted order-note" id="order-note" hidden>First match wins when pads overlap.</p>
      </section>

      <section class="card" aria-labelledby="inspector-heading">
        <header class="panel" id="inspector">
          <h2 id="inspector-heading">Pad inspector</h2>
          <div class="order-actions" id="order-actions" hidden>
            <button id="move-up" type="button" aria-label="Move pad up" title="Move pad up">↑</button>
            <button id="move-down" type="button" aria-label="Move pad down" title="Move pad down">↓</button>
          </div>
        </header>
        <p class="empty" id="inspector-empty">Select a pad to edit.</p>
        <fieldset id="pad-editor" aria-label="Selected pad settings" hidden>
          <label class="inline" for="pad-type">Type
            <select id="pad-type">
              <option>Drum</option>
              <option>Cymbal</option>
              <option>Pedal</option>
            </select>
          </label>

          <div class="fields" id="stick-fields">
            <p class="muted" id="position-help">Position (m) from your chest. X right, Y forward, Z up.</p>
            <div class="coords">
              <label>X <input id="position-x" type="number" step="any" aria-describedby="position-help"></label>
              <label>Y <input id="position-y" type="number" step="any" aria-describedby="position-help"></label>
              <label>Z <input id="position-z" type="number" step="any" aria-describedby="position-help"></label>
            </div>
            <div class="pair">
              <label>Radius (m) <input id="pad-radius" type="number" step="any" min="0"></label>
              <label>Tilt (rad, optional) <input id="pad-tilt" type="number" step="any" placeholder="0"></label>
            </div>
          </div>

          <label class="inline" id="pedal-fields" hidden>Pedal input
            <select id="pedal-input">
              <option value="">Select an input</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </label>

          <div class="sample-field">
            <label>Audio sample <input id="pad-audio" type="text" placeholder="/sdcard/sounds/sample.mp3" spellcheck="false"></label>
            <button id="browse-audio" type="button">Browse</button>
          </div>

          <div class="fields" id="alternate-section">
            <label class="check"><input id="alternate-enabled" type="checkbox"> Add a second sound for the <span id="alternate-zone"></span></label>
            <div class="fields" id="alternate-fields" hidden>
              <label>Zone boundary radius (m) <input id="alternate-radius" type="number" step="any" min="0"></label>
              <div class="sample-field">
                <label>Second audio sample <input id="alternate-audio" type="text" spellcheck="false"></label>
                <button id="browse-alternate" type="button">Browse</button>
              </div>
            </div>
          </div>
          <button class="remove" id="remove-pad" type="button">Remove pad</button>
        </fieldset>
      </section>
    </div>
  </main>

  <dialog class="card" id="sample-dialog" aria-labelledby="sample-heading">
    <header class="panel">
      <h2 id="sample-heading">Audio samples</h2>
      <form method="dialog"><button autofocus>Close</button></form>
    </header>
    <p class="muted" id="samples-status" role="status"></p>
    <div id="sample-list"></div>
  </dialog>

  <template id="pad-row">
    <li>
      <button class="pad-row" type="button" aria-pressed="false">
        <span class="pad-index"></span>
        <strong></strong>
        <small></small>
      </button>
    </li>
  </template>
</body>
</html>
